name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.0)"
        required: true
      notes:
        description: "Release notes override (optional; leave blank to use latest_release_notes.md)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize version
        id: ver
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # Resolve the release notes ONCE into a temp file that both the in-app
      # update notes (version.json) and the GitHub release body read from. The
      # dispatch box wins when filled in (handy for a quick one-liner); otherwise
      # we fall back to the repo's latest_release_notes.md, which is where you
      # write rich, multi-line markdown without fighting the single-line input.
      # It holds ONLY the current release's notes (not a running changelog).
      - name: Resolve release notes
        id: notes
        env:
          INPUT_NOTES: ${{ inputs.notes }}
        run: |
          OUT="$RUNNER_TEMP/release-notes.md"
          if [ -n "${INPUT_NOTES//[$'\t\r\n ']/}" ]; then
            printf '%s\n' "$INPUT_NOTES" > "$OUT"
          elif [ -f latest_release_notes.md ]; then
            cp latest_release_notes.md "$OUT"
          else
            : > "$OUT"
          fi
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Bump version everywhere
        env:
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          npm version "$V" --no-git-tag-version
          printf '// Single source of truth for the displayed app version (nav footer + About).\n// The release workflow rewrites this file; do not edit by hand.\nexport const APP_VERSION = '"'"'v%s'"'"';\n' "$V" > public/js/version.js
          # the in-browser demo ships its own copy of the frontend, so keep its
          # displayed version in lockstep (it's a verbatim copy of the file above)
          cp public/js/version.js smartoneg.com/demo/app/js/version.js
          # rebuild the whole demo snapshot from public/ + server/ so every release
          # ships a demo that matches the app being released (build:demo copies the
          # just-written version.js too, so this stays in lockstep)
          npm run build:demo
          # the static site (GitHub Pages) serves this; the app polls it to
          # detect a newer release. Written with node so notes are JSON-safe.
          V="$V" node -e '
            const fs = require("fs");
            const v = process.env.V;
            let notes = "";
            try { notes = fs.readFileSync(process.env.NOTES_FILE, "utf8"); } catch {}
            const out = {
              version: v,
              url: "https://github.com/${{ github.repository }}/releases/tag/v" + v,
              notes: notes.trim(),
            };
            fs.writeFileSync("smartoneg.com/version.json", JSON.stringify(out, null, 2) + "\n");
          '

      # Refresh the marketing site's dashboard hero (light + dark) so it shows the
      # current design and the version just written above. Runs AFTER the bump and
      # BEFORE the commit, so the PNGs ride along in the same "Release vX" commit
      # and deploy with the site. Public repo => Actions minutes are unmetered;
      # this is hero-only (no feature crops / PDFs) so it stays quick.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # The app's font stack starts with system-ui / ui-sans-serif, which on
      # macOS is San Francisco but on the Linux runner falls back to DejaVu Sans
      # (wider + heavier) — that skews the hero and wraps lines. Install Inter and
      # steer the default sans-serif to it (Roboto / Liberation Sans as fallbacks)
      # so the runner renders close to macOS.
      - name: Install UI fonts for a consistent hero render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-roboto || true
          mkdir -p "$HOME/.config/fontconfig"
          cat > "$HOME/.config/fontconfig/fonts.conf" <<'CONF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias><family>sans-serif</family><prefer>
              <family>Inter</family><family>Roboto</family><family>Liberation Sans</family>
            </prefer></alias>
            <match target="pattern"><test name="family"><string>system-ui</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit></match>
            <match target="pattern"><test name="family"><string>ui-sans-serif</string></test>
              <edit name="family" mode="prepend" binding="strong"><string>Inter</string></edit></match>
          </fontconfig>
          CONF
          fc-cache -f >/dev/null 2>&1 || true
      # TZ so zmanim render in the demo location's timezone (America/New_York),
      # not the runner's UTC — otherwise candle lighting shows ~4 hours late.
      - name: Refresh dashboard hero screenshots
        env:
          TZ: America/New_York
        run: HERO_ONLY=1 node scripts/feature-shots.mjs

      - name: Commit and tag
        run: |
          V="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json public/js/version.js smartoneg.com/demo smartoneg.com/version.json smartoneg.com/assets/screenshots/dashboard.png smartoneg.com/assets/screenshots/dashboard-dark.png
          git commit -m "Release v$V"
          git tag "v$V"
          git push origin HEAD --tags

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Optional Docker Hub mirror — only when both secrets are present, so a
      # repo without them still releases (GHCR-only) without failing here.
      - name: Compose image tags
        id: tags
        run: |
          V="${{ steps.ver.outputs.version }}"
          {
            echo "list<<EOF"
            echo "ghcr.io/${{ github.repository }}:v$V"
            if [[ "$V" != *-* ]]; then
              echo "ghcr.io/${{ github.repository }}:latest"
            fi
            if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
              echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/smart-oneg:v$V"
              if [[ "$V" != *-* ]]; then
                echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/smart-oneg:latest"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.tags.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          RELEASE_ARGS=()
          if [[ "$V" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi
          # attach the repo's docker-compose.yml so the latest/download URL works.
          # notes come from the file resolved earlier (dispatch box or
          # latest_release_notes.md).
          gh release create "v$V" docker-compose.yml \
            --title "SmartOneg v$V" \
            --notes-file "${{ steps.notes.outputs.file }}" \
            --target "$(git rev-parse HEAD)" \
            "${RELEASE_ARGS[@]}"

      # Optional Homebrew formula bump — only when the tap token secret exists,
      # so releases run fine without it. Pre-releases skip the bump entirely.
      # (secrets can't be read in a step `if:`, so gate on a computed flag.)
      - name: Check Homebrew secret
        id: brew
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      # Push the new url + sha256 straight to the tap's main (no PR to merge), so
      # `brew upgrade smart-oneg` works right after a stable release. The checksum
      # is computed from the exact tag tarball we just pushed, so it can't drift.
      - name: Update Homebrew tap
        if: steps.brew.outputs.enabled == 'true' && !contains(steps.ver.outputs.version, '-')
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          URL="https://github.com/${{ github.repository }}/archive/refs/tags/v$V.tar.gz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/moshechaikin/homebrew-tap.git" tap
          F="tap/Formula/smart-oneg.rb"
          sed -i -E "s|^( *)url \".*\"|\1url \"$URL\"|" "$F"
          sed -i -E "s|^( *)sha256 \".*\"|\1sha256 \"$SHA\"|" "$F"
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "github-actions[bot]@users.noreply.github.com"
          git -C tap commit -am "smart-oneg $V"
          git -C tap push origin HEAD:main

  # Publish the static site (smartoneg.com) after a release. The release commit
  # is pushed with GITHUB_TOKEN, which by design does NOT trigger the separate
  # Pages workflow (static.yml) — so without this, a release would bump the
  # version in git but never redeploy the live site. This deploys main's latest
  # (the freshly pushed release commit) so version.json + the demo update too.
  deploy-site:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the just-pushed release commit
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'smartoneg.com'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
